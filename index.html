    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong colours.
      (function () {
        try {
          var saved = localStorage.getItem('campusconnect_theme_v1');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.addEventListener('DOMContentLoaded', function () { document.body.classList.add('dark'); });
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
